name: Deliver new chapters to Telegram

on:
  workflow_dispatch:
  schedule:
    # Runs every 2 hours -- adjust as you like
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests huggingface_hub Pillow

      - name: Send new chapters to Telegram
        env:
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          python telegram_deliver.py 2>&1 | tee debug_log.txt

      - name: Commit debug log
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add debug_log.txt
          git commit -m "Update debug log [skip ci]" || echo "No changes to commit"
          git pull --rebase --no-edit origin main || true
          git push
